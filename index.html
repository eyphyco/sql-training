<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL Training — 集計・結合・実行計画のハンズオン</title>
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="集計・ウィンドウ関数・結合・実行計画・正規化を、ブラウザの中の DuckDB で手を動かして学ぶ演習サイト。"
    />
    <script>
      // 描画前に配色を確定させ、リロード時のちらつきを防ぐ
      (function () {
        try {
          var stored = localStorage.getItem('sql-training:theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      このサイトは JavaScript で動きます（SQL もブラウザの中で実行するため）。
      有効にしてから読み込み直してください。
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
